spring.application.name=banque

# Base de developpement : docker compose up -d
spring.datasource.url=jdbc:postgresql://localhost:5432/banque
spring.datasource.username=banque
spring.datasource.password=banque

# Le schema est gere par Flyway (src/main/resources/db/migration), Hibernate se contente de verifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Seule la sante de l'application est exposee
management.endpoints.web.exposure.include=health

# Seuil au-dela duquel un virement doit etre confirme par le client (front)
banque.seuil-confirmation=1000.00
